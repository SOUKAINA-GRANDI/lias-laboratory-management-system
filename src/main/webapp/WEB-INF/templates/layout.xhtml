<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>LIAS Management</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#F5F1E8}

        .wrapper{display:flex;height:100vh}

        .sidebar{
            width:220px;
            background:#0A1628;
            color:white;
            display:flex;
            flex-direction:column
        }

        .logo{
            padding:20px;
            font-family:'Cormorant Garamond',serif;
            font-size:20px;
            font-weight:700;
            color:#C8A951
        }

        .menu{flex:1;padding:10px}

        .menu a{
            display:block;
            padding:8px 12px;
            color:rgba(255,255,255,0.6);
            text-decoration:none;
            font-size:13px;
            border-left:3px solid transparent
        }

        .menu a:hover{
            background:#1E3A5F;
            color:#C8A951;
            border-left-color:#C8A951
        }

        .content{flex:1;display:flex;flex-direction:column}

        .topbar{
            height:60px;
            background:white;
            border-bottom:1px solid #ddd;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 20px
        }

        .main{
            padding:20px;
            overflow:auto;
            flex:1
        }

        .footer{
            background:#0A1628;
            color:white;
            text-align:center;
            padding:8px;
            font-size:12px
        }

        .badge{
            background:#C8A951;
            color:#0A1628;
            padding:2px 6px;
            border-radius:12px;
            font-size:10px
        }

    </style>

</h:head>

<h:body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LIAS</div>
        <div class="menu">
            <ui:include src="menu.xhtml"/>
        </div>

        <div style="padding:15px;border-top:1px solid rgba(255,255,255,0.1)">
            <div style="font-size:12px">
                #{loginBean.utilisateurConnecte.username}
            </div>
            <div style="font-size:10px;color:rgba(255,255,255,0.5)">
                #{loginBean.utilisateurConnecte.typeUtilisateur}
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">

        <div class="topbar">
            <div>Tableau de bord</div>

            <h:form>
                <h:commandLink value="Logout"
                               action="#{loginBean.logout}"
                               style="color:#0A1628"/>
            </h:form>
        </div>

        <div class="main">
            <ui:insert name="content"/>
        </div>

        <ui:include src="footer.xhtml"/>

    </div>

</div>

</h:body>
</html>
